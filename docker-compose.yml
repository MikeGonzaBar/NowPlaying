services:
  api:
    build:
      context: ./API
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8080"
    volumes:
      - ./API:/app
      - api_static:/app/NowPlayingAPI/staticfiles
    env_file:
      - ./API/.env
    environment:
      - PORT=8080
      - RUN_MIGRATIONS=true
      - ENABLE_ADMIN_SITE=false
      - ENABLE_API_DOCS=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    # The container command runs migrations before gunicorn. Dependents must
    # wait for the HTTP server, not just for the container process to start,
    # otherwise sync-worker can query tables that migrations haven't created.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api-auth/login/', timeout=5)\"",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  api-admin:
    build:
      context: ./API
      dockerfile: ./Dockerfile
    # api-admin shares the api_static volume with the api service, so it must not
    # run collectstatic itself (running two collectors concurrently on the same
    # volume races and can crash startup - FileNotFoundError). The api service
    # collects first; api-admin waits for it.
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-8011}:8080"
    volumes:
      - ./API:/app
      - api_static:/app/NowPlayingAPI/staticfiles
    env_file:
      - ./API/.env
    environment:
      - PORT=8080
      - RUN_MIGRATIONS=false
      - RUN_COLLECTSTATIC=false
      - ENABLE_ADMIN_SITE=true
      - ENABLE_API_DOCS=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  sync-worker:
    build:
      context: ./API
      dockerfile: ./Dockerfile
    restart: unless-stopped
    volumes:
      - ./API:/app
    env_file:
      - ./API/.env
    environment:
      - RUN_MIGRATIONS=false
      - RUN_COLLECTSTATIC=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["sh", "-c", "cd NowPlayingAPI && python manage.py run_sync_worker"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  ui:
    build:
      context: ./UI/now-playing-ui
      dockerfile: ./Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${UI_PORT:-3200}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy

  # Optional local Postgres for self-contained testing. By default the API
  # connects to the Supabase Postgres configured in API/.env; start this
  # service explicitly with `docker compose --profile local-db up -d` and
  # point SUPABASE_DB_* at `db` if you need an offline database.
  db:
    profiles: ["local-db"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  api_static:
  postgres_data:
  redis_data:
