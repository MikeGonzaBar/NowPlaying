services:
  api:
    build:
      context: ./API
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8080"
    volumes:
      - ./API:/app
      - api_static:/app/NowPlayingAPI/staticfiles
    env_file:
      - ./API/.env
    environment:
      - PORT=8080
      - RUN_MIGRATIONS=true
      - ENABLE_ADMIN_SITE=false
      - ENABLE_API_DOCS=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  api-admin:
    build:
      context: ./API
      dockerfile: ./Dockerfile
    # api-admin shares the api_static volume with the api service, so it must not
    # run collectstatic itself (running two collectors concurrently on the same
    # volume races and can crash startup - FileNotFoundError). The api service
    # collects first; api-admin waits for it.
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-8011}:8080"
    volumes:
      - ./API:/app
      - api_static:/app/NowPlayingAPI/staticfiles
    env_file:
      - ./API/.env
    environment:
      - PORT=8080
      - RUN_MIGRATIONS=false
      - RUN_COLLECTSTATIC=false
      - ENABLE_ADMIN_SITE=true
      - ENABLE_API_DOCS=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  ui:
    build:
      context: ./UI/now-playing-ui
      dockerfile: ./Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${UI_PORT:-3200}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  # The local Postgres service (db) was retired as part of the Supabase
  # migration (plan Phase 7). The app now uses Supabase Postgres via
  # USE_LOCAL_SUPABASE=1 in API/.env. Restore the db service from git
  # history (tag pre-supabase-2026-09-21) if a rollback is ever needed;
  # the postgres_data volume was kept on the host.
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  api_static:
  redis_data:
