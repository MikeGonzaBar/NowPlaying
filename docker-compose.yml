services:
  api:
    build:
      context: ./API
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8080"
    volumes:
      - ./API:/app
      - api_static:/app/NowPlayingAPI/staticfiles
    env_file:
      - ./API/.env
    environment:
      - PORT=8080
      - RUN_MIGRATIONS=true
      - ENABLE_ADMIN_SITE=false
      - ENABLE_API_DOCS=false
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-admin:
    build:
      context: ./API
      dockerfile: ./Dockerfile
    # api-admin shares the api_static volume with the api service, so it must not
    # run collectstatic itself (running two collectors concurrently on the same
    # volume races and can crash startup - FileNotFoundError). The api service
    # collects first; api-admin waits for it.
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-8011}:8080"
    volumes:
      - ./API:/app
      - api_static:/app/NowPlayingAPI/staticfiles
    env_file:
      - ./API/.env
    environment:
      - PORT=8080
      - RUN_MIGRATIONS=false
      - RUN_COLLECTSTATIC=false
      - ENABLE_ADMIN_SITE=true
      - ENABLE_API_DOCS=true
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  ui:
    build:
      context: ./UI/now-playing-ui
      dockerfile: ./Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${UI_PORT:-3200}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  db:
    build:
      context: ./DB
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    env_file:
      - ./DB/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nowplaying_user -d nowplaying -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  api_static:
  postgres_data:
  redis_data:
